version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'npm'
    directory: '/generators/node-server/resources'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 10
    ignore:
      # Keep @types/node aligned with the Node.js major version of the generated application
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      jest:
        patterns:
          - '@jest/globals'
          - '@types/jest'
          - 'jest'
          - 'ts-jest'
      nestjs:
        patterns:
          - '@nestjs/common'
          - '@nestjs/core'
          - '@nestjs/microservices'
          - '@nestjs/platform-express'
          - '@nestjs/platform-fastify'
          - '@nestjs/platform-socket.io'
          - '@nestjs/platform-ws'
          - '@nestjs/testing'
          - '@nestjs/websockets'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
