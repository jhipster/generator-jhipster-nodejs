name: build-cache
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
permissions:
  contents: read
jobs:
  build-cache:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/app
    steps:
      - uses: actions/checkout@v7
        with:
          path: generator-jhipster-nodejs
      - uses: jhipster/actions/setup-runner@v2
        with:
          node-version: 24
          binary-dir: ${{ github.workspace }}/generator-jhipster-nodejs/cli/
      - uses: jhipster/actions/cache-npm-dependencies@v2
        with:
          generator-path: generator-jhipster-nodejs
        if: always()
      # Every sample, each one in a folder of its name, then the dependencies of each one in the npm cache.
      - run: cli.cjs generate-sample --all --skip-install
        continue-on-error: true
      - run: for sample in */; do (cd "$sample" && npm install) || true; done
        continue-on-error: true
      - uses: jhipster/actions/save-cache@v2
        if: always()
        with:
          key: ${{ github.run_id }}
          npm: true
          maven: true
          gradle: true
      - uses: jhipster/actions/restore-cache@v2
        with:
          npm: true
          maven: true
          gradle: true
