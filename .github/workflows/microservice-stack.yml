name: Microservice Stack
concurrency:
  # Group PRs by head_ref, push to main branch by commit id, and others branch by ref.
  group: ${{ github.workflow }}-${{ github.head_ref || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
permissions:
  contents: read
env:
  NODE_OPTIONS: --dns-result-order=ipv4first
  FORCE_COLOR: 2
jobs:
  gateway-spring-microservice-microfrontend:
    # A JHipster Spring Boot gateway and a NodeJS microservice with an Angular microfrontend, generated by the JHipster CLI so
    # each application uses the blueprints of its JDL (the blueprint CLI generates every application with this blueprint).
    # Tested with the npm scripts of the applications, like the samples of JHipster, then deployed with JHipster's
    # docker-compose generator: the end-to-end tests of the gateway run against the whole stack, the JHipster Registry,
    # the gateway and the microservice from their Docker images.
    name: gateway-spring-microservice-microfrontend (${{ matrix.e2e }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        e2e: [cypress, playwright]
    defaults:
      run:
        working-directory: ${{ github.workspace }}/app
    steps:
      - uses: actions/checkout@v7
        with:
          path: generator-jhipster-nodejs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: npm install
        working-directory: ${{ github.workspace }}/generator-jhipster-nodejs
      - run: mkdir -p app
        working-directory: ${{ github.workspace }}
      - name: 'GENERATE the applications with the JHipster CLI'
        run: |
          # The JDL of the microservice declares this blueprint: make the checkout resolvable as an installed package.
          mkdir -p node_modules
          ln -s "$GITHUB_WORKSPACE/generator-jhipster-nodejs" node_modules/generator-jhipster-nodejs
          # Both applications get the end-to-end test framework of the job.
          perl -pe 's/^(    applicationType .*)$/$1\n    testFrameworks [${{ matrix.e2e }}]/' \
            "$GITHUB_WORKSPACE/generator-jhipster-nodejs/.github/microservice-stack/gateway-spring-microservice-microfrontend.jdl" > stack.jdl
          "$GITHUB_WORKSPACE/generator-jhipster-nodejs/node_modules/.bin/jhipster" jdl stack.jdl --skip-install --skip-git --skip-jhipster-dependencies
          test -f gateway/pom.xml
          test -f notes/server/package.json
      - name: 'GENERATE the Docker Compose deployment'
        run: |
          # The NodeJS blueprint in the deployment adapts the Docker Compose files of the NodeJS applications.
          mkdir docker-compose
          cat > docker-compose/.yo-rc.json <<'EOF'
          {
            "generator-jhipster": {
              "appsFolders": ["gateway", "notes"],
              "directoryPath": "../",
              "deploymentType": "docker-compose",
              "serviceDiscoveryType": "eureka",
              "monitoring": "no",
              "clusteredDbApps": [],
              "blueprints": [{ "name": "generator-jhipster-nodejs" }]
            }
          }
          EOF
          cd docker-compose
          "$GITHUB_WORKSPACE/generator-jhipster-nodejs/node_modules/.bin/jhipster" docker-compose --defaults --no-insight
          cat docker-compose.yml
          test ! -e ../notes/src
      - name: 'TEST the NodeJS microservice'
        working-directory: ${{ github.workspace }}/app/notes
        run: |
          npm install
          npm test
          npm run test:server:e2e
          npm run build
          test -f server/dist/static/remoteEntry.json
          npm run docker:build
      - name: 'TEST the Spring Boot gateway'
        working-directory: ${{ github.workspace }}/app/gateway
        run: |
          npm install
          npm run ci:backend:test
          npm run ci:frontend:test
          npm run java:docker
      - name: 'START the Docker Compose deployment'
        run: |
          docker compose -f docker-compose/docker-compose.yml up --wait
          docker ps -a
      - name: 'CHECK the gateway tokens and microfrontend through the gateway'
        run: |
          set -e
          TOKEN=$(curl -sf -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}' http://localhost:8080/api/authenticate | jq -r .id_token)
          AUTH="Authorization: Bearer $TOKEN"
          # The route to the microservice appears once the gateway sees it in the registry. The ci:server:await:notes script
          # of the gateway waits for /management/health/readiness, which the NodeJS microservice does not have.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" http://localhost:8080/services/notes/api/notes)
            [ "$code" = 200 ] && break
            sleep 5
          done
          test "$code" = 200
          curl -sf -H "$AUTH" -H 'Content-Type: application/json' -d '{"title":"from the gateway"}' http://localhost:8080/services/notes/api/notes | jq -e '.createdBy == "admin"'
          curl -sf -H "$AUTH" http://localhost:8080/services/notes/api/account | jq -e '.login == "admin" and (.authorities | index("ROLE_ADMIN"))'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/services/notes/api/notes)" = 401
          curl -sf http://localhost:8080/services/notes/remoteEntry.json | jq -e '.name == "notes" and (.exposes | map(.key) | index("./entity-routes"))'
      - name: 'INSTALL the Playwright browser'
        if: matrix.e2e == 'playwright'
        working-directory: ${{ github.workspace }}/app/gateway
        run: npx playwright install --with-deps chromium
      - name: 'E2E the gateway, with the microfrontend of the microservice'
        working-directory: ${{ github.workspace }}/app/gateway
        run: npm run e2e:headless
      - name: 'UPLOAD the end-to-end test results'
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.e2e }}
          path: |
            app/gateway/target/cypress/
            app/gateway/target/playwright/
          if-no-files-found: ignore
      - name: 'LOGS'
        if: always()
        run: |
          docker compose -f docker-compose/docker-compose.yml logs --tail 200 || true
      - name: 'TEARDOWN'
        if: always()
        run: docker compose -f docker-compose/docker-compose.yml down -v || true
