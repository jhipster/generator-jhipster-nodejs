name: Microservice Stack
concurrency:
  # Group PRs by head_ref, push to main branch by commit id, and others branch by ref.
  group: ${{ github.workflow }}-${{ github.head_ref || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
permissions:
  contents: read
env:
  NODE_OPTIONS: --dns-result-order=ipv4first
  FORCE_COLOR: 2
jobs:
  gateway-spring-microservice-microfrontend:
    # A JHipster Spring Boot gateway and a NodeJS microservice with an Angular microfrontend, generated by the JHipster CLI so
    # each application uses the blueprints of its JDL (the blueprint CLI generates every application with this blueprint).
    name: gateway-spring-microservice-microfrontend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ github.workspace }}/app
    steps:
      - uses: actions/checkout@v7
        with:
          path: generator-jhipster-nodejs
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - run: npm install
        working-directory: ${{ github.workspace }}/generator-jhipster-nodejs
      - run: mkdir -p app
        working-directory: ${{ github.workspace }}
      - name: 'GENERATE the applications with the JHipster CLI'
        run: |
          # The JDL of the microservice declares this blueprint: make the checkout resolvable as an installed package.
          mkdir -p node_modules
          ln -s "$GITHUB_WORKSPACE/generator-jhipster-nodejs" node_modules/generator-jhipster-nodejs
          cp "$GITHUB_WORKSPACE/generator-jhipster-nodejs/.github/microservice-stack/gateway-spring-microservice-microfrontend.jdl" .
          "$GITHUB_WORKSPACE/generator-jhipster-nodejs/node_modules/.bin/jhipster" jdl gateway-spring-microservice-microfrontend.jdl --skip-install --skip-git --skip-jhipster-dependencies
          test -f gateway/pom.xml
          test -f notes/server/package.json
      - name: 'TEST the NodeJS microservice'
        working-directory: ${{ github.workspace }}/app/notes
        run: |
          npm install
          npm test --workspaces
          npm run test:server:e2e
          npm run build
          test -f server/dist/static/remoteEntry.json
      - name: 'BUILD the Spring Boot gateway'
        working-directory: ${{ github.workspace }}/app/gateway
        run: ./mvnw -ntp -B -Pdev -DskipTests package
      - name: 'START the JHipster Registry, the gateway database, the gateway and the microservice'
        run: |
          docker run -d --name registry -p 8761:8761 \
            -v "$PWD/gateway/src/main/docker/central-server-config:/central-config" \
            -e SPRING_PROFILES_ACTIVE=dev,api-docs -e SPRING_SECURITY_USER_PASSWORD=admin -e JHIPSTER_REGISTRY_PASSWORD=admin \
            -e SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_TYPE=native \
            -e SPRING_CLOUD_CONFIG_SERVER_COMPOSITE_0_SEARCH_LOCATIONS=file:./central-config/localhost-config/ \
            jhipster/jhipster-registry:v7.5.0
          docker run -d --name postgresql -p 5432:5432 -e POSTGRES_USER=gateway -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18.6
          for i in $(seq 1 60); do curl -sf -u admin:admin http://localhost:8761/management/health > /dev/null && break; sleep 5; done
          (cd gateway && nohup java -jar target/*.jar --spring.profiles.active=dev --spring.docker.compose.enabled=false > ../gateway.log 2>&1 &)
          (cd notes/server && BACKEND_ENV=test EUREKA_CLIENT_ENABLED=true nohup node dist/main.js > ../../notes.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:8080/management/health > /dev/null && break; sleep 5; done
      - name: 'CHECK the gateway tokens and microfrontend through the gateway'
        run: |
          set -e
          TOKEN=$(curl -sf -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}' http://localhost:8080/api/authenticate | jq -r .id_token)
          AUTH="Authorization: Bearer $TOKEN"
          # The route to the microservice appears once the gateway sees it in the registry.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "$AUTH" http://localhost:8080/services/notes/api/notes)
            [ "$code" = 200 ] && break
            sleep 5
          done
          test "$code" = 200
          curl -sf -H "$AUTH" -H 'Content-Type: application/json' -d '{"title":"from the gateway"}' http://localhost:8080/services/notes/api/notes | jq -e '.createdBy == "admin"'
          curl -sf -H "$AUTH" http://localhost:8080/services/notes/api/account | jq -e '.login == "admin" and (.authorities | index("ROLE_ADMIN"))'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/services/notes/api/notes)" = 401
          curl -sf http://localhost:8080/services/notes/remoteEntry.json | jq -e '.name == "notes" and (.exposes | map(.key) | index("./entity-routes"))'
      - name: 'LOGS'
        if: always()
        run: |
          tail -n 200 gateway.log notes.log || true
          docker logs registry --tail 100 || true
