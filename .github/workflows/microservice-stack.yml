name: Microservice Stack
concurrency:
  # Group PRs by head_ref, push to main branch by commit id, and others branch by ref.
  group: ${{ github.workflow }}-${{ github.head_ref || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '*'
permissions:
  contents: read
env:
  NODE_OPTIONS: --dns-result-order=ipv4first
  FORCE_COLOR: 2
jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: build
        run: |
          npm install
          ./cli/cli.cjs github-build-matrix microservice-stack
  samples:
    # The samples of the microservice-stack group, like the microservices samples of JHipster: a JDL with a Spring Boot
    # gateway, a NodeJS microservice and their docker-compose deployment, generated as a workspace (each application with
    # the blueprints of its JDL), then tested by the ci:e2e scripts of the workspace against the deployed stack.
    name: ${{ matrix.job-name || matrix.sample }}
    runs-on: ${{ matrix.os }}
    needs: build-matrix
    defaults:
      run:
        working-directory: ${{ github.workspace }}/app
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.build-matrix.outputs.matrix)}}
    steps:
      - uses: actions/checkout@v7
        with:
          path: generator-jhipster-nodejs
          fetch-depth: 2
      - uses: jhipster/actions/setup-runner@v2
        with:
          node-version: ${{ matrix.node-version }}
          java-version: ${{ matrix.java-version }}
          maven-cache: true
          binary-dir: ${{ github.workspace }}/generator-jhipster-nodejs/cli/
      - run: npm install
        working-directory: ${{ github.workspace }}/generator-jhipster-nodejs
      - run: cli.cjs generate-sample ${{ matrix.sample }} --skip-jhipster-dependencies --skip-install ${{ matrix.extra-args }}
      - uses: jhipster/actions/compare-sample@v2
        id: compare
        if: >-
          github.event.pull_request &&
          !contains(github.event.pull_request.labels.*.name, 'pr: disable-compare')
        with:
          generator-path: generator-jhipster-nodejs
          cmd: cli.cjs generate-sample ${{ matrix.sample }} --skip-jhipster-dependencies --skip-install ${{ matrix.extra-args }}
      - name: 'PREPARE: npm install'
        if: steps.compare.outputs.equals != 'true'
        run: npm install
      - name: 'TESTS: packaging'
        id: packaging
        if: steps.compare.outputs.equals != 'true'
        run: npm run ci:e2e:package
      - name: 'TESTS: Start the docker compose deployment'
        id: docker-compose
        if: steps.compare.outputs.equals != 'true'
        run: npm run ci:e2e:prepare
      - name: 'E2E: Run'
        id: e2e
        if: steps.compare.outputs.equals != 'true'
        run: npm run ci:e2e:run --if-present
      - name: 'E2E: Store failure e2e assets'
        uses: actions/upload-artifact@v7
        if: always() && steps.e2e.outcome == 'failure'
        with:
          name: e2e-${{ matrix.sample }}
          path: |
            ${{ github.workspace }}/app/**/cypress/screenshots
            ${{ github.workspace }}/app/**/cypress/videos
            ${{ github.workspace }}/app/**/playwright/results
            ${{ github.workspace }}/app/**/playwright/report
      - name: Dump docker logs
        if: always()
        uses: jwalton/gh-docker-logs@v2
      - name: 'TEARDOWN'
        if: always() && steps.docker-compose.outcome != 'skipped'
        run: npm run ci:e2e:teardown --if-present
  check-microservice-stack:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [samples]
    if: always()
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if [ 'skipped' == '${{ needs.samples.result }}' ] || [ 'success' == '${{ needs.samples.result }}' ] || [ 'closed' == '${{ github.event.action }}' ]; then
            exit 0
          fi
          exit 1
